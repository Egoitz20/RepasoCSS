<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 1.1: Calculadora Rotatoria con CSS Grid</title>
  <!-- Estilos separados en archivo .css externo -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="cabecera-ejercicio">
    <h1>📱 Calculadora Rotatoria (CSS Grid)</h1>
    <p>Ejercicio 1.1 de <em>teoria.pdf</em>: Botones cuadrados con colores diferenciados y vista apaisada/landscape adaptativa.</p>
    <a href="../index.html" class="btn-volver-hub">⬅ Volver al Menú de Ejercicios</a>
    
    <!-- Botón simulador de rotación manual -->
    <div style="margin-top: 15px;">
      <button onclick="alternarModoApaisado()" style="background: #0d477a; color: white; border: none; padding: 8px 16px; border-radius: 20px; font-weight: bold; cursor: pointer;">
        🔄 Simular Rotación (Vertical / Apaisado)
      </button>
    </div>
  </header>

  <!-- Tarjeta principal de la Calculadora -->
  <main class="calculadora-card" id="calc-card">
    
    <!-- Pantalla Display -->
    <div class="calculadora-display" id="display">0</div>

    <!-- Botonera maquetada con CSS Grid -->
    <div class="calculadora-grid">
      <!-- Fila 1: Acciones y borrado -->
      <button class="btn-calc btn-borrar" onclick="borrarDisplay()">C</button>
      <button class="btn-calc btn-operador" onclick="escribirCar('/')">/</button>
      <button class="btn-calc btn-operador" onclick="escribirCar('*')">×</button>
      <button class="btn-calc btn-operador" onclick="escribirCar('-')">-</button>

      <!-- Fila 2: Números 7, 8, 9 y suma -->
      <button class="btn-calc" onclick="escribirCar('7')">7</button>
      <button class="btn-calc" onclick="escribirCar('8')">8</button>
      <button class="btn-calc" onclick="escribirCar('9')">9</button>
      <button class="btn-calc btn-operador" onclick="escribirCar('+')">+</button>

      <!-- Fila 3: Números 4, 5, 6 -->
      <button class="btn-calc" onclick="escribirCar('4')">4</button>
      <button class="btn-calc" onclick="escribirCar('5')">5</button>
      <button class="btn-calc" onclick="escribirCar('6')">6</button>
      <button class="btn-calc btn-operador" onclick="escribirCar('%')">%</button>

      <!-- Fila 4: Números 1, 2, 3 -->
      <button class="btn-calc" onclick="escribirCar('1')">1</button>
      <button class="btn-calc" onclick="escribirCar('2')">2</button>
      <button class="btn-calc" onclick="escribirCar('3')">3</button>
      <button class="btn-calc" onclick="escribirCar('.')">.</button>

      <!-- Fila 5: Cero y botón igual expandido (grid-column: span 2) -->
      <button class="btn-calc" onclick="escribirCar('0')">0</button>
      <button class="btn-calc" onclick="escribirCar('00')">00</button>
      <button class="btn-calc btn-igual" onclick="calcular()">=</button>
    </div>

  </main>

  <script>
    // Lógica interactiva de los botones
    let valorPantalla = "0";
    const displayEl = document.getElementById("display");

    function actualizarDisplay() {
      displayEl.textContent = valorPantalla;
    }

    function escribirCar(car) {
      if (valorPantalla === "0" && car !== ".") {
        valorPantalla = car;
      } else {
        valorPantalla += car;
      }
      actualizarDisplay();
    }

    function borrarDisplay() {
      valorPantalla = "0";
      actualizarDisplay();
    }

    function calcular() {
      try {
        // Reemplazar visuales antes de evaluar
        const expr = valorPantalla.replace(/×/g, '*');
        valorPantalla = String(eval(expr));
      } catch (e) {
        valorPantalla = "Error";
      }
      actualizarDisplay();
    }

    function alternarModoApaisado() {
      document.getElementById("calc-card").classList.toggle("modo-apaisado");
    }
  </script>
</body>
</html>
